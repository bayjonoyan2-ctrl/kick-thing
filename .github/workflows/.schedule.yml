name: 3. Schedule Stream

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_TRIGGER }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check schedules and fire streams if ready
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGER }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/scheduler.py
name: 1. Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube / Video URL'
        required: true
      schedule_kick_hours:
        description: 'Start Kick stream in N hours (0 = off)'
        required: true
        default: '0'
      schedule_twitch_hours:
        description: 'Start Twitch stream in N hours (0 = off)'
        required: true
        default: '0'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_TRIGGER }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: pip install -r scripts/requirements.txt

      - name: Install FFmpeg (Fast Mirror)
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Write cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: 1. Download
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          SCHEDULE_KICK_HOURS: ${{ github.event.inputs.schedule_kick_hours }}
          SCHEDULE_TWITCH_HOURS: ${{ github.event.inputs.schedule_twitch_hours }}
        run: python scripts/download.py

      - name: 2. Render QR Overlay
        run: python scripts/render.py

      - name: 3. Save Video
        run: mv rendered.mp4 video.mp4

      - name: Commit schedule files
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add schedule_kick.txt schedule_twitch.txt
          git commit -m "Update stream schedules" || true
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video.mp4
          retention-days: 3
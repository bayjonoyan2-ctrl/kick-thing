name: 1. Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube / Video URL'
        required: true
      start_in_hours:
        description: 'Start stream after N hours (0 = manual only)'
        required: false
        default: '0'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_TRIGGER }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: pip install -r scripts/requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Write cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download (720p60 priority)
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          START_IN_HOURS: ${{ github.event.inputs.start_in_hours }}
        run: python scripts/download.py

      - name: Commit schedule.txt
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add schedule.txt
          git commit -m "Set stream schedule: $(cat schedule.txt)" || true
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video.mp4
          retention-days: 3
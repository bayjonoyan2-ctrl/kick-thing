name: 2. Stream to Kick

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Start offset in seconds (for long-video handover)'
        required: false
        default: '0'

jobs:
  stream:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download saved video artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Using download run: $RUN_ID"
          gh run download $RUN_ID -n downloaded-video

      - name: Stream to Kick
        env:
          KICK_STREAM_URL: ${{ secrets.KICK_STREAM_URL }}
          KICK_STREAM_KEY: ${{ secrets.KICK_STREAM_KEY }}
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGER }}
          REPO: ${{ github.repository }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: python scripts/stream.py
name: 2. Stream to Kick

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Start offset in seconds'
        required: false
        default: '0'

jobs:
  stream:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download saved video artifact
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGER }}
        run: |
          echo "Looking for latest successful download..."
          RUN_ID=""
          for i in {1..10}; do
            RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Found Run ID: $RUN_ID"
              break
            fi
            echo "No successful download found yet. Waiting 10 seconds..."
            sleep 10
          done
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "❌ Error: Could not find a successful Download Video workflow."
            exit 1
          fi
          
          gh run download $RUN_ID -n downloaded-video

      - name: Stream to Kick
        env:
          KICK_STREAM_URL: ${{ secrets.KICK_STREAM_URL }}
          KICK_STREAM_KEY: ${{ secrets.KICK_STREAM_KEY }}
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGER }}
          REPO: ${{ github.repository }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: python scripts/stream.py